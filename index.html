<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bryce Ramos Photography | Portfolio Website Coming Soon</title>
  <meta name="description" content="The Bryce Ramos Photography portfolio website is coming soon.">
  <meta name="theme-color" content="#f5f4f2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #141414;
      --ink-2: #4a4a4a;
      --ink-3: #5c5c5c;
      --ink-4: #8a8a8a;
      --line: #d4d4d4;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      color: var(--ink);
      background: #f5f4f2;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: linear-gradient(to bottom, #fbfaf8 0%, #f5f4f2 50%, #e9e9ea 100%);
    }

    /* Soft blurred backdrop */
    .glow { position: absolute; border-radius: 50%; pointer-events: none; }
    .glow-1 { left: 50%; top: -10%; width: 90%; height: 70%; transform: translateX(-50%); background: #cfc8c0; opacity: 0.35; filter: blur(80px); }
    .glow-2 { right: -10%; bottom: -20%; width: 50%; height: 60%; background: #e6ddd2; opacity: 0.6; filter: blur(70px); }
    .glow-3 { left: -10%; top: 30%; width: 40%; height: 50%; background: #dfe3ea; opacity: 0.7; filter: blur(70px); }

    header {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 40px 64px;
    }
    .brand { font-size: 12px; font-weight: 500; line-height: 18px; letter-spacing: 0.35em; text-transform: uppercase; color: #1a1a1a; }
    .site { font-size: 12px; font-weight: 300; line-height: 18px; letter-spacing: 0.2em; color: #6b6b6b; }

    main {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 56px;
      width: 100%;
      max-width: 720px;
      padding: 64px 24px;
    }

    .headline { display: flex; flex-direction: column; align-items: center; gap: 24px; }

    h1 {
      font-size: 64px;
      font-weight: 200;
      line-height: 67px;
      letter-spacing: 0.22em;
      text-align: center;
      text-transform: uppercase;
      color: var(--ink);
      padding-left: 0.22em; /* balances trailing letter-spacing so lines center optically */
    }
    h1 span { display: block; }

    .tagline { font-size: 15px; font-weight: 300; line-height: 22.5px; letter-spacing: 0.12em; color: var(--ink-3); text-align: center; }

    /* Progress */
    .progress { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
    .track { position: relative; height: 1px; width: 100%; background: var(--line); }
    .fill {
      position: absolute; left: 0; top: 0; height: 1px; width: 70%;
      background: var(--ink);
      transform-origin: left center;
      animation: grow 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .dot {
      position: absolute; left: 70%; top: -3px;
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--ink);
      transform: translateX(-50%);
      animation: dot 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes dot { from { left: 0; } to { left: 70%; } }
    .marks { display: flex; justify-content: space-between; align-items: center; font-size: 11px; line-height: 16.5px; letter-spacing: 0.25em; }
    .marks .dim { font-weight: 300; color: var(--ink-4); }
    .marks .now { font-weight: 500; color: var(--ink); }

    /* Notify form */
    .notify {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 440px;
      padding: 6px 6px 6px 24px;
      border: 1px solid #dcdcdc;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: border-color 0.2s ease;
    }
    .notify:focus-within { border-color: #9a9a9a; }
    .notify input {
      flex: 1;
      min-width: 0;
      height: 40px;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    .notify input::placeholder { color: #9a9a9a; }
    .notify button {
      flex: none;
      height: 40px;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font: inherit;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .notify button:hover { background: #2a2a2a; }
    .notify button:active { background: #000; }
    .notify button:focus-visible,
    .social a:focus-visible,
    .contact a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    .sr { position: absolute; left: -9999px; }

    /* Footer */
    footer {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      padding: 16px 24px 40px;
    }
    .social { display: flex; gap: 12px; }
    .social a {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px;
      border: 1px solid #c9c9c9;
      border-radius: 50%;
      color: #2a2a2a;
      font-size: 14px;
      transition: border-color 0.2s ease;
    }
    .social a:hover { border-color: var(--ink); }
    .social svg { width: 1em; height: 1em; display: block; }

    .contact { display: flex; align-items: center; gap: 16px; font-size: 12px; font-weight: 300; line-height: 18px; letter-spacing: 0.15em; color: var(--ink-2); }
    .contact a { color: inherit; text-decoration: none; }
    .contact a:hover { color: var(--ink); }
    .contact .sep { width: 1px; height: 12px; background: #cfcfcf; }
    .legal { font-size: 11px; font-weight: 300; line-height: 16.5px; letter-spacing: 0.12em; color: #8f8f8f; text-align: center; }

    /* Mobile */
    @media (max-width: 640px) {
      header { flex-direction: column; gap: 8px; padding: 32px 24px; }
      .site { display: none; }
      main { gap: 40px; padding: 40px 24px; }
      h1 { font-size: 34px; line-height: 51px; letter-spacing: 0.16em; padding-left: 0.16em; }
      .tagline { font-size: 14px; line-height: 21px; }
      .notify { flex-direction: column; align-items: stretch; border-radius: 24px; padding: 8px; gap: 8px; }
      .notify input { width: 100%; padding: 0 16px; text-align: center; }
      .notify button { width: 100%; }
      .contact { flex-direction: column; gap: 4px; }
      .contact .sep { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fill, .dot { animation: none; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <header>
      <span class="brand">Bryce Ramos Photography</span>
      <span class="site">www.bryceramosphotography.com</span>
    </header>

    <main>
      <div class="headline">
        <h1>
          <span>Portfolio</span>
          <span>Website</span>
          <span>Coming Soon</span>
        </h1>
        <p class="tagline">A new home for my work is on its way.</p>
      </div>

      <div class="progress" role="img" aria-label="Website progress: 70 percent complete">
        <div class="track"><div class="fill"></div><div class="dot"></div></div>
        <div class="marks">
          <span class="dim">0%</span>
          <span class="now">70%</span>
          <span class="dim">100%</span>
        </div>
      </div>

      <form class="notify" action="mailto:bryce@bryceramos.com" method="post" enctype="text/plain">
        <label for="email" class="sr">Email address</label>
        <input id="email" name="email" type="email" placeholder="Your email address" autocomplete="email" required>
        <button type="submit">Notify me</button>
      </form>
    </main>

    <footer>
      <div class="social">
        <!-- TODO: replace href="#" with the real Instagram profile URL -->
        <a href="https://www.instagram.com/bryce.snaps.photos/" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10m0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4m5.3-9.7a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4M16.5 2h-9A5.5 5.5 0 0 0 2 7.5v9A5.5 5.5 0 0 0 7.5 22h9a5.5 5.5 0 0 0 5.5-5.5v-9A5.5 5.5 0 0 0 16.5 2m3.7 14.5a3.7 3.7 0 0 1-3.7 3.7h-9a3.7 3.7 0 0 1-3.7-3.7v-9a3.7 3.7 0 0 1 3.7-3.7h9a3.7 3.7 0 0 1 3.7 3.7z"/></svg>
        </a>
      </div>
      <div class="contact">
        <a href="mailto:bryce@bryceramos.com">bryce@bryceramos.com</a>
        <span class="sep"></span>
        <span>www.bryceramosphotography.com</span>
      </div>
      <span class="legal">© 2026 Bryce Ramos Photography.</span>
    </footer>
  </div>
</body>
</html>
